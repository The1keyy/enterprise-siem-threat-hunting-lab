id: SF-005
name: Encoded PowerShell process
description: >
  Sysmon event 1 for powershell.exe or pwsh.exe whose command line has
  -EncodedCommand, -enc, or -e followed by a base64 token of at least 8
  characters. Security 4688 is not this rule.
severity: high
mitre:
  - T1059.001
telemetry:
  - sysmon
wazuh_rule_ids:
  - "100210"
sigma_file: detections/sigma/SF-005.yml
version: "1"
status: SYNTAX VALID
windows_validation_required: true
logtest_mode: limited
parent_rules:
  - "61603"
required_telemetry: >
  Sysmon operational event 1 on WS01, with CommandLine. Audit process
  creation (4688) is a separate logging choice. Rule 67027 matches 4688 and
  does not read commandLine, so this detection does not use 4688.
false_positives: A management tool starts PowerShell with an encoded command. The token U1lOVEhFVElD in the lab reference is the word SYNTHETIC.
tuning_notes: >
  Level 13 is high (ADR 0004), one above stock 92057 (level 12) so this
  description wins when both match. 92057 requires a powershell.exe parent
  and a powershell.exe command line, and its flag list does not include
  pwsh.exe. This image has no pwsh rule. This rule matches powershell.exe
  or pwsh.exe and requires the flag plus a base64 token. MITRE is T1059.001
  only. 92071 also tags T1047 and only after WMI. Exclusions are ossec-agent
  and sentinelforge-setup in the command line, image, or parent image.
  No other exclusion.
test_procedure: >
  make logtest ID=SF-005 reports LIMITED and does not call logtest.
  Analysisd loaded the XML with no rule error. Lab procedure is in
  docs/detections/SF-005.md. Not run.
expected_event: Sysmon 1 on WS01 for powershell.exe or pwsh.exe with -enc or -EncodedCommand and a base64 token.
expected_alert: Description starts with SF-005. Rule 100210, level 13. MITRE T1059.001 only.
observed_result: "NOT YET VALIDATED"
