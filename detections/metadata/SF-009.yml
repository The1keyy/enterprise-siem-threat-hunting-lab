required_telemetry: >
  Audit User Account Management, Success. A 4720 on WS01 is a local user.
  A 4720 on DC01 is a domain user. The rule does not filter the computer
  name, so both match.
false_positives: An administrator creates sf-test-user, or a local user on WS01.
tuning_notes: >
