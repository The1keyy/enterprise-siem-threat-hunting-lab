id: SF-009
name: New local or domain user
description: >
  Security 4720, a user account was created. Enabling an account (4722)
  and creating a computer account (4741) are not this rule. It stays
  medium on its own. A later add to a privileged group is SF-007 or
  SF-008. Joining them is Step 14.
severity: medium
