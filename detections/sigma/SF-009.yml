title: SF-009 new user account created
id: 2a8774d6-b2cb-4ea1-a107-38f150066458
status: experimental
description: >
  Security 4720. Account enabled (4722) and computer account created
  (4741) are not this rule. A following add to a privileged group is
  SF-007 or SF-008. The correlation engine joins those. This selection does not.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4720
  condition: selection
level: medium
tags:
  - attack.persistence
  - attack.t1136.001
falsepositives:
