name: app

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "fixtures/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "fixtures/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build like Vercel (demo only)
        env:
          VERCEL: "1"
          VITE_DATA_MODE: demo
        run: npm run build

      - name: Live mode must not build on Vercel
        run: |
          if VERCEL=1 VITE_DATA_MODE=live node scripts/assert-demo-build.mjs; then
            echo "A live-mode Vercel build was allowed."
            exit 1
          fi

      - name: Vitest
        run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest
