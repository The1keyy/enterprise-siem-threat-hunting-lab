name: secrets

# gitleaks-action v2 is free for a repository owned by a GitHub personal
# account. The1keyy is type User, so GITLEAKS_LICENSE is not set.
# Push and pull_request scan the commits in that event.
# workflow_dispatch passes no --log-opts, so gitleaks scans the full history.
# .gitleaks.toml is loaded because gitleaks 8.30 reads GITLEAKS_CONFIG,
# then <source>/.gitleaks.toml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
