    expect:
      fires: false
      rule_id: 100110
  - name: negative_benign
    mode: lab_reference
    limited_reason: >
      REQUIRES WINDOWS VALIDATION / logtest-limited. Eventchannel is not replayed.
    log_format: eventchannel
    location: EventChannel
    event: '{"win":{"system":{"providerName":"Microsoft-Windows-Security-Auditing","eventID":"4624","channel":"Security","computer":"WS01.sentinelforge.lab","severityValue":"AUDIT_SUCCESS","message":"An account was successfully logged on. SYNTHETIC TEST INPUT"},"eventdata":{"targetUserName":"sf-test-carol","ipAddress":"127.0.0.1","logonType":"2","workstationName":"WS01"}}}'
    expect:
