# SYNTHETIC TEST INPUT — not lab telemetry.
comment: SYNTHETIC TEST INPUT
id: CANARY-001
description: Built-in sshd rules. Invalid-user failure must fire. Successful publickey must not fire that same rule.
cases:
  - name: invalid-user-failure
    log_format: syslog
    location: /var/log/auth.log
    event: "Oct 26 12:00:00 ubu01 sshd[1234]: Failed password for invalid user sf-test-alice from 10.10.10.20 port 51514 ssh2"
    expect:
      fires: true
      # Observed on wazuh/wazuh-manager:4.14.9 linux/arm64 via PUT /logtest.
      rule_id: 5710
      level: 5
      mitre:
        - T1110.001
        - T1021.004
  - name: accepted-publickey
    log_format: syslog
    location: /var/log/auth.log
    event: "Oct 26 12:00:01 ubu01 sshd[1234]: Accepted publickey for sf-test-bob from 10.10.10.20 port 51515 ssh2"
    expect:
      # The failure rule must not fire. Another rule (observed 5715) may fire.
      fires: false
      rule_id: 5710
