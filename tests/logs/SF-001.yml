# SYNTHETIC TEST INPUT — not a Windows agent event and not lab telemetry.
# mode lab_reference: the runner does not call logtest.
# REQUIRES WINDOWS VALIDATION. Max status is SYNTAX VALID.
# VERIFY: location EventChannel is the string used in CANARY-002. A real agent
# location still needs the lab.
comment: SYNTHETIC TEST INPUT
id: SF-001
description: >
  Six 4625s for one domain account on DC01 fire rule 100100. Five do not.
  A success does not. A machine account (name ending in $) does not.
  Domain account events are on DC01. Local accounts would be on WS01.
cases:
  - name: positive
    mode: lab_reference
    limited_reason: >
      REQUIRES WINDOWS VALIDATION / logtest-limited. Eventchannel is not
      replayed. Status stays SYNTAX VALID.
    log_format: eventchannel
    location: EventChannel
    events:
      - '{"win":{"system":{"providerName":"Microsoft-Windows-Security-Auditing","eventID":"4625","channel":"Security","computer":"DC01.sentinelforge.lab","severityValue":"AUDIT_FAILURE","message":"An account failed to log on. SYNTHETIC TEST INPUT 1"},"eventdata":{"targetUserName":"sf-test-alice","ipAddress":"10.10.10.200","logonType":"3","workstationName":"LAB-CLIENT"}}}'
      - '{"win":{"system":{"providerName":"Microsoft-Windows-Security-Auditing","eventID":"4625","channel":"Security","computer":"DC01.sentinelforge.lab","severityValue":"AUDIT_FAILURE","message":"An account failed to log on. SYNTHETIC TEST INPUT 2"},"eventdata":{"targetUserName":"sf-test-alice","ipAddress":"10.10.10.200","logonType":"3","workstationName":"LAB-CLIENT"}}}'
      - '{"win":{"system":{"providerName":"Microsoft-Windows-Security-Auditing","eventID":"4625","channel":"Security","computer":"DC01.sentinelforge.lab","severityValue":"AUDIT_FAILURE","message":"An account failed to log on. SYNTHETIC TEST INPUT 3"},"eventdata":{"targetUserName":"sf-test-alice","ipAddress":"10.10.10.200","logonType":"3","workstationName":"LAB-CLIENT"}}}'
      - '{"win":{"system":{"providerName":"Microsoft-Windows-Security-Auditing","eventID":"4625","channel":"Security","computer":"DC01.sentinelforge.lab","severityValue":"AUDIT_FAILURE","message":"An account failed to log on. SYNTHETIC TEST INPUT 4"},"eventdata":{"targetUserName":"sf-test-alice","ipAddress":"10.10.10.200","logonType":"3","workstationName":"LAB-CLIENT"}}}'
      - '{"win":{"system":{"providerName":"Microsoft-Windows-Security-Auditing","eventID":"4625","channel":"Security","computer":"DC01.sentinelforge.lab","severityValue":"AUDIT_FAILURE","message":"An account failed to log on. SYNTHETIC TEST INPUT 5"},"eventdata":{"targetUserName":"sf-test-alice","ipAddress":"10.10.10.200","logonType":"3","workstationName":"LAB-CLIENT"}}}'
      - '{"win":{"system":{"providerName":"Microsoft-Windows-Security-Auditing","eventID":"4625","channel":"Security","computer":"DC01.sentinelforge.lab","severityValue":"AUDIT_FAILURE","message":"An account failed to log on. SYNTHETIC TEST INPUT 6"},"eventdata":{"targetUserName":"sf-test-alice","ipAddress":"10.10.10.200","logonType":"3","workstationName":"LAB-CLIENT"}}}'
    expect:
      fires: true
      rule_id: 100100
      level: 11
      mitre:
        - T1110.001
