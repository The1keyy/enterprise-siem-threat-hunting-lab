# Status: NOT TESTED. A definition, not a lab result.
# "Rare" is not a query_string. aggregation is a terms agg; the backend
# keeps buckets with doc_count <= max_doc_count.
id: HUNT-004
name: Rare Administrator Login
hypothesis: >
  A lab account that almost never logs on succeeded. SF-010 will not see it
  unless the logon is RDP type 10.
data_source:
  index: archives
  channel: Security
query: data.win.system.eventID:4624
time_window_default: 7d
aggregation:
  type: terms
  field: data.win.eventdata.targetUserName
  size: 50
  max_doc_count: 2
expected_behavior: >
  The lab accounts that sign in every day land in high-count buckets and
  are dropped. Low-count accounts are the ones to read.
suspicious_behavior: >
  A targetUserName with one or two 4624 events in the window, especially
  from a host or logonType that account does not normally use.
mitre:
  - id: T1078
    tactic: Initial Access
related_detections:
  - SF-010
differs_from_detections: >
  SF-010 alerts on RDP logon type 10, with extra rules for sf-test-admin and
  for DC01. This hunt does not filter on logon type or on that account. It
  groups every 4624 by targetUserName and keeps the low-count buckets. A
  busy account is discarded. A single query_string cannot express that.
investigation_guidance:
  - Read the low-count targetUserName values. Compare them with Lab Admins. sf-test-admin is not a Domain Admin.
  - For each low-count account, pivot to agent.name and data.win.eventdata.logonType.
  - Check SF-010 only to see whether the same logon was already an RDP alert. A type 3 or type 2 success is outside that rule.
  - Snapshot the VM before any response. Response actions are LAB ONLY and need explicit approval.
pivot_fields:
  - data.win.eventdata.targetUserName
  - data.win.eventdata.logonType
  - agent.name
status: NOT TESTED
