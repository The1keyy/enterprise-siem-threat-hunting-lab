# Status: NOT TESTED. A definition, not a lab result.
# "Unusual" is not a query_string. aggregation is a terms agg; the backend
# keeps buckets with doc_count <= max_doc_count.
id: HUNT-010
name: Unusual Process Execution
hypothesis: >
  A process image ran once or twice in the window. SF-005 only alerts when
  that image is powershell.exe or pwsh.exe and the command line is encoded.
data_source:
  index: wazuh-archives-*
  channel: Microsoft-Windows-Sysmon/Operational; Security
query: data.win.system.eventID:1 OR data.win.system.eventID:4688
time_window_default: 7d
aggregation:
  type: terms
  field: data.win.eventdata.image
  size: 50
  max_doc_count: 2
expected_behavior: >
  Images that start all day, including powershell.exe on a busy host, land
  in high-count buckets and are dropped.
suspicious_behavior: >
  An image with one or two events, especially one that is not a Windows
  component you already expect on WS01 or DC01.
mitre:
  - id: T1059
    tactic: Execution
related_detections:
  - SF-005
differs_from_detections: >
  SF-005 alerts only for powershell.exe or pwsh.exe with an encoded-command
  flag on Sysmon event 1. This hunt groups Sysmon event 1 and Security 4688
  by image and keeps the low-count buckets. A common image is discarded.
  4688 is collected and no SF rule alerts on a 4688 command line. A single
  query_string cannot express a low count.
investigation_guidance:
  - Read the low-count image values. A high-count image such as powershell.exe is not this result.
  - For a low-count image, open data.win.eventdata.commandLine and data.win.eventdata.parentImage on the matching events.
  - Sysmon event 1 and Security 4688 can both describe one process. Do not count them as two techniques.
  - Snapshot the VM before any response. Response actions are LAB ONLY and need explicit approval.
pivot_fields:
  - data.win.eventdata.image
  - data.win.eventdata.parentImage
  - agent.name
status: NOT TESTED
